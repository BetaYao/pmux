name: seamux
options:
  bundleIdPrefix: com.seamux
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.1"
  minimumXcodeGenVersion: "2.40"
  defaultConfig: Debug

packages:
  CodeEditSourceEditor:
    url: https://github.com/CodeEditApp/CodeEditSourceEditor
    exactVersion: 0.15.2
  CodeEditLanguages:
    url: https://github.com/CodeEditApp/CodeEditLanguages
    exactVersion: 0.1.20

targets:
  seamux:
    type: application
    platform: macOS
    dependencies:
      - package: CodeEditSourceEditor
        product: CodeEditSourceEditor
      - package: CodeEditLanguages
        product: CodeEditLanguages
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
      - path: ghostty.h
        type: file
        buildPhase: none
      - path: seamux-Bridging-Header.h
        type: file
        buildPhase: none
    settings:
      base:
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.seamux.app
        PRODUCT_NAME: seamux
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_OBJC_BRIDGING_HEADER: "$(PROJECT_DIR)/seamux-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/GhosttyKit.xcframework/macos-arm64_x86_64"
        OTHER_LDFLAGS:
          - "-lghostty"
          - "-lc++"
          - "-framework"
          - Metal
          - "-framework"
          - QuartzCore
          - "-framework"
          - IOSurface
          - "-framework"
          - UniformTypeIdentifiers
          - "-framework"
          - Carbon

  seamuxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        type: group
    dependencies:
      - target: seamux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seamux.tests
        GENERATE_INFOPLIST_FILE: YES

  seamuxUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        type: group
    dependencies:
      - target: seamux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seamux.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: seamux
